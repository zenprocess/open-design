name: distribution-exact-accept

on:
  workflow_dispatch:
    inputs:
      acceptance_matrix:
        description: "Canonical JSON matrix of targets requiring installed public acceptance."
        required: false
        type: string
        default: '{"include":[{"artifact_dir":"dmg","os":"mac","runner":"macos-14","target":"mac_arm64"},{"artifact_dir":"dmg","os":"mac","runner":"macos-15-intel","target":"mac_x64"},{"artifact_dir":"builder","os":"win","runner":"windows-latest","target":"win_x64"}]}'
      commit:
        description: "Candidate commit SHA from its manifest."
        required: true
        type: string
      content_identities:
        description: "Optional target Shell/Closure identity map enabling reusable content acceptance."
        required: false
        type: string
        default: '{}'
      exact_name:
        description: "Candidate channel, including prerelease or an exact channel."
        required: true
        type: string
      metadata_url:
        description: "Immutable candidate version metadata URL."
        required: true
        type: string
      mutable_metadata_url:
        description: "Acceptance discovery URL; the immutable metadata URL itself is valid."
        required: true
        type: string
      public_origin:
        description: "Release public origin."
        required: true
        type: string
      release_version:
        description: "Exact occupied candidate version."
        required: true
        type: string
  workflow_call:
    inputs:
      acceptance_matrix:
        required: false
        type: string
        default: '{"include":[{"artifact_dir":"dmg","os":"mac","runner":"macos-14","target":"mac_arm64"},{"artifact_dir":"dmg","os":"mac","runner":"macos-15-intel","target":"mac_x64"},{"artifact_dir":"builder","os":"win","runner":"windows-latest","target":"win_x64"}]}'
      commit:
        required: true
        type: string
      content_identities:
        required: false
        type: string
        default: '{}'
      exact_name:
        required: true
        type: string
      metadata_url:
        required: true
        type: string
      mutable_metadata_url:
        required: true
        type: string
      public_origin:
        required: true
        type: string
      release_version:
        required: true
        type: string
    outputs:
      activation_completed_at:
        value: ${{ jobs.activate.outputs.activation_completed_at }}

permissions:
  actions: write
  contents: read

jobs:
  plan:
    name: Plan public content acceptance
    runs-on: ubuntu-latest
    outputs:
      acceptance_count: ${{ steps.acceptance.outputs.acceptance_count }}
      acceptance_matrix: ${{ steps.acceptance.outputs.acceptance_matrix }}
      mac_arm64_closure: ${{ steps.acceptance.outputs.mac_arm64_closure }}
      mac_arm64_run: ${{ steps.acceptance.outputs.mac_arm64_run }}
      mac_arm64_semantic: ${{ steps.acceptance.outputs.mac_arm64_semantic }}
      mac_arm64_shell: ${{ steps.acceptance.outputs.mac_arm64_shell }}
      mac_x64_closure: ${{ steps.acceptance.outputs.mac_x64_closure }}
      mac_x64_run: ${{ steps.acceptance.outputs.mac_x64_run }}
      mac_x64_semantic: ${{ steps.acceptance.outputs.mac_x64_semantic }}
      mac_x64_shell: ${{ steps.acceptance.outputs.mac_x64_shell }}
      reuse_json: ${{ steps.acceptance.outputs.reuse_json }}
      win_x64_closure: ${{ steps.acceptance.outputs.win_x64_closure }}
      win_x64_run: ${{ steps.acceptance.outputs.win_x64_run }}
      win_x64_semantic: ${{ steps.acceptance.outputs.win_x64_semantic }}
      win_x64_shell: ${{ steps.acceptance.outputs.win_x64_shell }}
    steps:
      - name: Checkout accepted commit
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.commit }}
      - name: Resolve public acceptance topology
        id: acceptance
        uses: ./.github/actions/release/public-acceptance/plan
        with:
          acceptance-matrix: ${{ inputs.acceptance_matrix }}
          content-identities: ${{ inputs.content_identities }}

  public_acceptance:
    name: Accept public ${{ matrix.target }} exact artifacts
    needs: plan
    if: ${{ needs.plan.outputs.acceptance_count != '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.acceptance_matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      GITHUB_SHA: ${{ inputs.commit }}
      OPEN_DESIGN_POSTINSTALL_LEVEL: release-smoke
      RELEASE_COMMIT: ${{ inputs.commit }}
      RELEASE_NAMESPACE: ${{ matrix.target == 'mac_arm64' && format('release-{0}', inputs.exact_name) || matrix.target == 'mac_x64' && format('release-{0}-x64', inputs.exact_name) || format('release-{0}-win', inputs.exact_name) }}
      RELEASE_PUBLIC_ORIGIN: ${{ inputs.public_origin }}
      RELEASE_TARGET: ${{ matrix.target }}
      RELEASE_VERSION: ${{ inputs.release_version }}
    steps:
      - name: Checkout accepted commit
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.commit }}
      - name: Execute immutable public ${{ matrix.target }} acceptance
        uses: ./.github/actions/release/public-acceptance/execute
        with:
          artifact-dir: ${{ matrix.artifact_dir }}
          channel: ${{ inputs.exact_name }}
          commit: ${{ inputs.commit }}
          metadata-url: ${{ inputs.metadata_url }}
          mutable-metadata-url: ${{ inputs.mutable_metadata_url }}
          namespace: ${{ env.RELEASE_NAMESPACE }}
          os: ${{ matrix.os }}
          public-origin: ${{ inputs.public_origin }}
          release-version: ${{ inputs.release_version }}
          target: ${{ matrix.target }}
      - name: Upload public ${{ matrix.target }} acceptance credential
        uses: actions/upload-artifact@v7
        with:
          name: open-design-${{ inputs.exact_name }}-${{ matrix.target }}-public-acceptance
          path: ${{ runner.temp }}/public-feedback/${{ matrix.target }}.json
          if-no-files-found: error
      - name: Upload public ${{ matrix.target }} acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: open-design-${{ inputs.exact_name }}-${{ matrix.target }}-public-acceptance-evidence
          path: |
            ${{ runner.temp }}/public-feedback/build.json
            ${{ runner.temp }}/public-feedback/plan.json
            ${{ runner.temp }}/public-feedback/report
          if-no-files-found: warn

  activate:
    name: Activate accepted exact release
    needs: [plan, public_acceptance]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.public_acceptance.result == 'success' || needs.public_acceptance.result == 'skipped') }}
    runs-on: ubuntu-latest
    outputs:
      activation_completed_at: ${{ steps.activation.outputs.activated_at }}
    env:
      OPEN_DESIGN_POSTINSTALL_LEVEL: release-prepare
      RELEASE_CHANNEL: ${{ inputs.exact_name }}
      RELEASE_PUBLIC_ORIGIN: ${{ inputs.public_origin }}
      RELEASE_VERSION: ${{ inputs.release_version }}
    steps:
      - name: Checkout accepted commit
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.commit }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download all public acceptance credentials
        if: ${{ needs.plan.outputs.acceptance_count != '0' }}
        uses: actions/download-artifact@v8
        with:
          pattern: open-design-${{ inputs.exact_name }}-*-public-acceptance
          merge-multiple: true
          path: ${{ runner.temp }}/public-acceptance
      - name: Register reusable mac_arm64 public acceptance receipt
        if: ${{ needs.plan.outputs.mac_arm64_run == 'true' }}
        env:
          RELEASE_PUBLIC_ACCEPTANCE_CREDENTIAL_PATH: ${{ runner.temp }}/public-acceptance/mac_arm64.json
          RELEASE_PUBLIC_ACCEPTANCE_SEMANTIC_DIGEST: ${{ needs.plan.outputs.mac_arm64_semantic }}
          RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
          RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
          RELEASE_STORAGE_REGION: auto
          RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
        run: pnpm exec tools-release register-public-acceptance-receipt
      - name: Register completed mac_arm64 public acceptance
        if: ${{ needs.plan.outputs.mac_arm64_run == 'true' }}
        uses: ./.github/actions/hash-skip
        env:
          HASH_SKIP_EXTRA_CLOSURE: ${{ needs.plan.outputs.mac_arm64_closure }}
          HASH_SKIP_EXTRA_SHELL: ${{ needs.plan.outputs.mac_arm64_shell }}
        with:
          hash_skip: release.public-acceptance.mac
          mode: complete
      - name: Register reusable mac_x64 public acceptance receipt
        if: ${{ needs.plan.outputs.mac_x64_run == 'true' }}
        env:
          RELEASE_PUBLIC_ACCEPTANCE_CREDENTIAL_PATH: ${{ runner.temp }}/public-acceptance/mac_x64.json
          RELEASE_PUBLIC_ACCEPTANCE_SEMANTIC_DIGEST: ${{ needs.plan.outputs.mac_x64_semantic }}
          RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
          RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
          RELEASE_STORAGE_REGION: auto
          RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
        run: pnpm exec tools-release register-public-acceptance-receipt
      - name: Register completed mac_x64 public acceptance
        if: ${{ needs.plan.outputs.mac_x64_run == 'true' }}
        uses: ./.github/actions/hash-skip
        env:
          HASH_SKIP_EXTRA_CLOSURE: ${{ needs.plan.outputs.mac_x64_closure }}
          HASH_SKIP_EXTRA_SHELL: ${{ needs.plan.outputs.mac_x64_shell }}
        with:
          hash_skip: release.public-acceptance.mac
          mode: complete
      - name: Register reusable win_x64 public acceptance receipt
        if: ${{ needs.plan.outputs.win_x64_run == 'true' }}
        env:
          RELEASE_PUBLIC_ACCEPTANCE_CREDENTIAL_PATH: ${{ runner.temp }}/public-acceptance/win_x64.json
          RELEASE_PUBLIC_ACCEPTANCE_SEMANTIC_DIGEST: ${{ needs.plan.outputs.win_x64_semantic }}
          RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
          RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
          RELEASE_STORAGE_REGION: auto
          RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
        run: pnpm exec tools-release register-public-acceptance-receipt
      - name: Register completed win_x64 public acceptance
        if: ${{ needs.plan.outputs.win_x64_run == 'true' }}
        uses: ./.github/actions/hash-skip
        env:
          HASH_SKIP_EXTRA_CLOSURE: ${{ needs.plan.outputs.win_x64_closure }}
          HASH_SKIP_EXTRA_SHELL: ${{ needs.plan.outputs.win_x64_shell }}
        with:
          hash_skip: release.public-acceptance.win
          mode: complete
      - name: Issue stable qualification for accepted prerelease
        if: ${{ inputs.exact_name == 'prerelease' }}
        env:
          RELEASE_MAC_ARM64_SMOKE_RESULT: success
          RELEASE_MAC_X64_SMOKE_RESULT: success
          RELEASE_MANIFEST_DIR: ${{ runner.temp }}/release-platform-manifests
          RELEASE_METADATA_PATH: ${{ runner.temp }}/release-metadata/metadata.json
          RELEASE_METADATA_URL: ${{ inputs.metadata_url }}
          RELEASE_OUTPUTS_PATH: ${{ runner.temp }}/release-qualification/outputs.json
          RELEASE_QUALIFICATION_WORK_DIR: ${{ runner.temp }}/release-qualification
          RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
          RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
          RELEASE_STORAGE_REGION: auto
          RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
          RELEASE_WIN_X64_SMOKE_RESULT: success
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE_MANIFEST_DIR" "$(dirname "$RELEASE_METADATA_PATH")"
          curl -fsSL "$RELEASE_METADATA_URL" -o "$RELEASE_METADATA_PATH"
          for target in mac_arm64 mac_x64 win_x64; do
            jq --arg target "$target" '.releaseTargets[$target]' "$RELEASE_METADATA_PATH" > "$RELEASE_MANIFEST_DIR/$target.json"
          done
          pnpm exec tools-release issue-stable-qualification
      - name: Activate accepted public release
        id: activation
        uses: ./.github/actions/release/public-acceptance/activate
        with:
          channel: ${{ inputs.exact_name }}
          commit: ${{ inputs.commit }}
          metadata-url: ${{ inputs.metadata_url }}
          public-origin: ${{ inputs.public_origin }}
          release-version: ${{ inputs.release_version }}
          reuse-json: ${{ needs.plan.outputs.reuse_json }}
        env:
          RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
          RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
          RELEASE_STORAGE_REGION: auto
          RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
      - name: Cleanup workflow artifacts
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release/github/cleanup-artifacts.sh
