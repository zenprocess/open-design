name: distribution-exact-accept

on:
  workflow_dispatch:
    inputs:
      acceptance_matrix:
        description: "Canonical JSON matrix of targets requiring installed public acceptance."
        required: false
        type: string
        default: '{"include":[{"artifact_dir":"dmg","os":"mac","runner":"macos-14","target":"mac_arm64"},{"artifact_dir":"dmg","os":"mac","runner":"macos-15-intel","target":"mac_x64"},{"artifact_dir":"builder","os":"win","runner":"windows-latest","target":"win_x64"}]}'
      commit:
        description: "Candidate commit SHA from its manifest."
        required: true
        type: string
      content_identities:
        description: "Optional target Shell/Closure identity map enabling reusable content acceptance."
        required: false
        type: string
        default: '{}'
      exact_name:
        description: "Candidate channel, including prerelease or an exact channel."
        required: true
        type: string
      metadata_url:
        description: "Immutable candidate version metadata URL."
        required: true
        type: string
      mutable_metadata_url:
        description: "Acceptance discovery URL; the immutable metadata URL itself is valid."
        required: true
        type: string
      public_origin:
        description: "Release public origin."
        required: true
        type: string
      release_version:
        description: "Exact occupied candidate version."
        required: true
        type: string
  workflow_call:
    inputs:
      acceptance_matrix:
        required: false
        type: string
        default: '{"include":[{"artifact_dir":"dmg","os":"mac","runner":"macos-14","target":"mac_arm64"},{"artifact_dir":"dmg","os":"mac","runner":"macos-15-intel","target":"mac_x64"},{"artifact_dir":"builder","os":"win","runner":"windows-latest","target":"win_x64"}]}'
      commit:
        required: true
        type: string
      content_identities:
        required: false
        type: string
        default: '{}'
      exact_name:
        required: true
        type: string
      metadata_url:
        required: true
        type: string
      mutable_metadata_url:
        required: true
        type: string
      public_origin:
        required: true
        type: string
      release_version:
        required: true
        type: string

permissions:
  actions: write
  contents: read

jobs:
  plan:
    name: Plan public content acceptance
    runs-on: ubuntu-latest
    outputs:
      acceptance_count: ${{ steps.selection.outputs.acceptance_count }}
      acceptance_matrix: ${{ steps.selection.outputs.acceptance_matrix }}
      mac_arm64_closure: ${{ steps.identities.outputs.mac_arm64_closure }}
      mac_arm64_run: ${{ steps.selection.outputs.mac_arm64_run }}
      mac_arm64_semantic: ${{ steps.mac_arm64.outputs.hash }}
      mac_arm64_shell: ${{ steps.identities.outputs.mac_arm64_shell }}
      mac_x64_closure: ${{ steps.identities.outputs.mac_x64_closure }}
      mac_x64_run: ${{ steps.selection.outputs.mac_x64_run }}
      mac_x64_semantic: ${{ steps.mac_x64.outputs.hash }}
      mac_x64_shell: ${{ steps.identities.outputs.mac_x64_shell }}
      reuse_json: ${{ steps.selection.outputs.reuse_json }}
      win_x64_closure: ${{ steps.identities.outputs.win_x64_closure }}
      win_x64_run: ${{ steps.selection.outputs.win_x64_run }}
      win_x64_semantic: ${{ steps.win_x64.outputs.hash }}
      win_x64_shell: ${{ steps.identities.outputs.win_x64_shell }}
    steps:
      - name: Checkout accepted commit
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.commit }}
      - name: Resolve acceptance content identities
        id: identities
        uses: actions/github-script@v8
        env:
          CONTENT_IDENTITIES: ${{ inputs.content_identities }}
        with:
          script: |
            const identities = JSON.parse(process.env.CONTENT_IDENTITIES || "{}");
            const targets = ["mac_arm64", "mac_x64", "win_x64"];
            const digest = /^sha256:[0-9a-f]{64}$/;
            const enabled = targets.every((target) => digest.test(identities[target]?.closure || "") && digest.test(identities[target]?.shell || ""));
            core.setOutput("enabled", String(enabled));
            for (const target of targets) {
              core.setOutput(`${target}_closure`, identities[target]?.closure || "");
              core.setOutput(`${target}_shell`, identities[target]?.shell || "");
            }

      - name: Probe mac_arm64 public acceptance proof
        id: mac_arm64
        if: ${{ steps.identities.outputs.enabled == 'true' }}
        uses: ./.github/actions/hash-skip
        env:
          HASH_SKIP_EXTRA_CLOSURE: ${{ steps.identities.outputs.mac_arm64_closure }}
          HASH_SKIP_EXTRA_SHELL: ${{ steps.identities.outputs.mac_arm64_shell }}
        with:
          hash_skip: release.public_acceptance.mac

      - name: Probe mac_x64 public acceptance proof
        id: mac_x64
        if: ${{ steps.identities.outputs.enabled == 'true' }}
        uses: ./.github/actions/hash-skip
        env:
          HASH_SKIP_EXTRA_CLOSURE: ${{ steps.identities.outputs.mac_x64_closure }}
          HASH_SKIP_EXTRA_SHELL: ${{ steps.identities.outputs.mac_x64_shell }}
        with:
          hash_skip: release.public_acceptance.mac

      - name: Probe win_x64 public acceptance proof
        id: win_x64
        if: ${{ steps.identities.outputs.enabled == 'true' }}
        uses: ./.github/actions/hash-skip
        env:
          HASH_SKIP_EXTRA_CLOSURE: ${{ steps.identities.outputs.win_x64_closure }}
          HASH_SKIP_EXTRA_SHELL: ${{ steps.identities.outputs.win_x64_shell }}
        with:
          hash_skip: release.public_acceptance.win

      - name: Select public acceptance topology
        id: selection
        uses: actions/github-script@v8
        env:
          ACCEPTANCE_MATRIX: ${{ inputs.acceptance_matrix }}
          CONTENT_IDENTITIES: ${{ inputs.content_identities }}
          CONTENT_IDENTITIES_ENABLED: ${{ steps.identities.outputs.enabled }}
          MAC_ARM64_HASH: ${{ steps.mac_arm64.outputs.hash }}
          MAC_ARM64_REUSE: ${{ steps.mac_arm64.outputs.skip }}
          MAC_X64_HASH: ${{ steps.mac_x64.outputs.hash }}
          MAC_X64_REUSE: ${{ steps.mac_x64.outputs.skip }}
          WIN_X64_HASH: ${{ steps.win_x64.outputs.hash }}
          WIN_X64_REUSE: ${{ steps.win_x64.outputs.skip }}
        with:
          script: |
            const matrix = JSON.parse(process.env.ACCEPTANCE_MATRIX);
            const identities = JSON.parse(process.env.CONTENT_IDENTITIES || "{}");
            const enabled = process.env.CONTENT_IDENTITIES_ENABLED === "true";
            const proof = {
              mac_arm64: { hash: process.env.MAC_ARM64_HASH, reuse: process.env.MAC_ARM64_REUSE === "true" },
              mac_x64: { hash: process.env.MAC_X64_HASH, reuse: process.env.MAC_X64_REUSE === "true" },
              win_x64: { hash: process.env.WIN_X64_HASH, reuse: process.env.WIN_X64_REUSE === "true" },
            };
            const include = matrix.include.filter(({ target }) => !enabled || !proof[target].reuse).map((entry) => ({
              ...entry,
              closure_identity_digest: identities[entry.target]?.closure || "",
              semantic_digest: enabled ? proof[entry.target].hash : "",
              shell_identity_digest: identities[entry.target]?.shell || "",
            }));
            const reuse = Object.fromEntries(matrix.include.filter(({ target }) => enabled && proof[target].reuse).map(({ target }) => [target, proof[target].hash]));
            core.setOutput("acceptance_count", String(include.length));
            core.setOutput("acceptance_matrix", JSON.stringify({ include }));
            core.setOutput("reuse_json", JSON.stringify(reuse));
            for (const target of ["mac_arm64", "mac_x64", "win_x64"]) {
              core.setOutput(`${target}_run`, String(include.some((entry) => entry.target === target) && enabled));
            }

  public_acceptance:
    name: Accept public ${{ matrix.target }} exact artifacts
    needs: plan
    if: ${{ needs.plan.outputs.acceptance_count != '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.acceptance_matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      GITHUB_SHA: ${{ inputs.commit }}
      OPEN_DESIGN_POSTINSTALL_LEVEL: release-smoke
      RELEASE_COMMIT: ${{ inputs.commit }}
      RELEASE_NAMESPACE: ${{ matrix.target == 'mac_arm64' && format('release-{0}', inputs.exact_name) || matrix.target == 'mac_x64' && format('release-{0}-x64', inputs.exact_name) || format('release-{0}-win', inputs.exact_name) }}
      RELEASE_PUBLIC_ORIGIN: ${{ inputs.public_origin }}
      RELEASE_TARGET: ${{ matrix.target }}
      RELEASE_VERSION: ${{ inputs.release_version }}
    steps:
      - name: Checkout accepted commit
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.commit }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Re-download immutable public ${{ matrix.target }} artifacts
        env:
          RELEASE_METADATA_URL: ${{ inputs.metadata_url }}
          RELEASE_PUBLIC_ACCEPTANCE_BUILD_JSON_PATH: ${{ runner.temp }}/public-feedback/build.json
          RELEASE_PUBLIC_ACCEPTANCE_DOWNLOAD_DIR: ${{ runner.temp }}/public-feedback/tools-pack/out/${{ matrix.os }}/namespaces/${{ env.RELEASE_NAMESPACE }}/${{ matrix.artifact_dir }}
          RELEASE_PUBLIC_ACCEPTANCE_PLAN_PATH: ${{ runner.temp }}/public-feedback/plan.json
        run: pnpm exec tools-release prepare-public-acceptance
      - name: Smoke immutable public ${{ matrix.target }} install and online Closure cold start
        working-directory: e2e
        env:
          OD_PACKAGED_E2E_BUILD_JSON_PATH: ${{ runner.temp }}/public-feedback/build.json
          OD_PACKAGED_E2E_MAC: ${{ matrix.os == 'mac' && '1' || '' }}
          OD_PACKAGED_E2E_MAC_SMOKE_LANES: shell
          OD_PACKAGED_E2E_MAC_SMOKE_PROFILE: core
          OD_PACKAGED_E2E_NAMESPACE: ${{ env.RELEASE_NAMESPACE }}
          OD_PACKAGED_E2E_RELEASE_CHANNEL: ${{ inputs.exact_name }}
          OD_PACKAGED_E2E_RELEASE_VERSION: ${{ inputs.release_version }}
          OD_PACKAGED_E2E_REPORT_DIR: ${{ runner.temp }}/public-feedback/report
          OD_PACKAGED_E2E_SHELL_SMOKE_PROOF: public-immutable-artifacts
          OD_PACKAGED_E2E_TOOLS_PACK_DIR: ${{ runner.temp }}/public-feedback/tools-pack
          # Exercise the final reusable-Shell shape: an empty Store receives a
          # mutable latest discovery URL, then Standalone re-fetches the exact
          # immutable sibling before preparation. No releaseVersion is injected.
          OD_STANDALONE_METADATA_URL: ${{ inputs.mutable_metadata_url }}
          OD_PACKAGED_E2E_WIN: ${{ matrix.os == 'win' && '1' || '' }}
          OD_PACKAGED_E2E_WIN_SMOKE_LANES: shell
          OD_PACKAGED_E2E_WIN_SMOKE_PROFILE: core
          OD_TOOLS_PACK_EMBEDDED_CONFIG_ONLY: "1"
        run: pnpm exec tsx scripts/release-smoke.ts ${{ matrix.os }} specs/${{ matrix.os }}.spec.ts
      - name: Issue public ${{ matrix.target }} acceptance credential
        env:
          RELEASE_PUBLIC_ACCEPTANCE_CREDENTIAL_PATH: ${{ runner.temp }}/public-feedback/${{ matrix.target }}.json
          RELEASE_PUBLIC_ACCEPTANCE_PLAN_PATH: ${{ runner.temp }}/public-feedback/plan.json
          RELEASE_PUBLIC_ACCEPTANCE_SMOKE_SUMMARY_PATH: ${{ runner.temp }}/public-feedback/report/summary.json
          RELEASE_PUBLIC_ACCEPTANCE_SUITE_RESULT_PATH: ${{ runner.temp }}/public-feedback/report/suite-result.json
        run: pnpm exec tools-release issue-public-acceptance
      - name: Upload public ${{ matrix.target }} acceptance credential
        uses: actions/upload-artifact@v7
        with:
          name: open-design-${{ inputs.exact_name }}-${{ matrix.target }}-public-acceptance
          path: ${{ runner.temp }}/public-feedback/${{ matrix.target }}.json
          if-no-files-found: error
      - name: Upload public ${{ matrix.target }} acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: open-design-${{ inputs.exact_name }}-${{ matrix.target }}-public-acceptance-evidence
          path: |
            ${{ runner.temp }}/public-feedback/build.json
            ${{ runner.temp }}/public-feedback/plan.json
            ${{ runner.temp }}/public-feedback/report
          if-no-files-found: warn

  activate:
    name: Activate accepted exact release
    needs: [plan, public_acceptance]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.public_acceptance.result == 'success' || needs.public_acceptance.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      OPEN_DESIGN_POSTINSTALL_LEVEL: release-prepare
      RELEASE_CHANNEL: ${{ inputs.exact_name }}
      RELEASE_PUBLIC_ORIGIN: ${{ inputs.public_origin }}
      RELEASE_VERSION: ${{ inputs.release_version }}
    steps:
      - name: Checkout accepted commit
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.commit }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download all public acceptance credentials
        if: ${{ needs.plan.outputs.acceptance_count != '0' }}
        uses: actions/download-artifact@v8
        with:
          pattern: open-design-${{ inputs.exact_name }}-*-public-acceptance
          merge-multiple: true
          path: ${{ runner.temp }}/public-acceptance
      - name: Register reusable mac_arm64 public acceptance receipt
        if: ${{ needs.plan.outputs.mac_arm64_run == 'true' }}
        env:
          RELEASE_PUBLIC_ACCEPTANCE_CREDENTIAL_PATH: ${{ runner.temp }}/public-acceptance/mac_arm64.json
          RELEASE_PUBLIC_ACCEPTANCE_SEMANTIC_DIGEST: ${{ needs.plan.outputs.mac_arm64_semantic }}
          RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
          RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
          RELEASE_STORAGE_REGION: auto
          RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
        run: pnpm exec tools-release register-public-acceptance-receipt
      - name: Register completed mac_arm64 public acceptance
        if: ${{ needs.plan.outputs.mac_arm64_run == 'true' }}
        uses: ./.github/actions/hash-skip
        env:
          HASH_SKIP_EXTRA_CLOSURE: ${{ needs.plan.outputs.mac_arm64_closure }}
          HASH_SKIP_EXTRA_SHELL: ${{ needs.plan.outputs.mac_arm64_shell }}
        with:
          hash_skip: release.public_acceptance.mac
          mode: complete
      - name: Register reusable mac_x64 public acceptance receipt
        if: ${{ needs.plan.outputs.mac_x64_run == 'true' }}
        env:
          RELEASE_PUBLIC_ACCEPTANCE_CREDENTIAL_PATH: ${{ runner.temp }}/public-acceptance/mac_x64.json
          RELEASE_PUBLIC_ACCEPTANCE_SEMANTIC_DIGEST: ${{ needs.plan.outputs.mac_x64_semantic }}
          RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
          RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
          RELEASE_STORAGE_REGION: auto
          RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
        run: pnpm exec tools-release register-public-acceptance-receipt
      - name: Register completed mac_x64 public acceptance
        if: ${{ needs.plan.outputs.mac_x64_run == 'true' }}
        uses: ./.github/actions/hash-skip
        env:
          HASH_SKIP_EXTRA_CLOSURE: ${{ needs.plan.outputs.mac_x64_closure }}
          HASH_SKIP_EXTRA_SHELL: ${{ needs.plan.outputs.mac_x64_shell }}
        with:
          hash_skip: release.public_acceptance.mac
          mode: complete
      - name: Register reusable win_x64 public acceptance receipt
        if: ${{ needs.plan.outputs.win_x64_run == 'true' }}
        env:
          RELEASE_PUBLIC_ACCEPTANCE_CREDENTIAL_PATH: ${{ runner.temp }}/public-acceptance/win_x64.json
          RELEASE_PUBLIC_ACCEPTANCE_SEMANTIC_DIGEST: ${{ needs.plan.outputs.win_x64_semantic }}
          RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
          RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
          RELEASE_STORAGE_REGION: auto
          RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
        run: pnpm exec tools-release register-public-acceptance-receipt
      - name: Register completed win_x64 public acceptance
        if: ${{ needs.plan.outputs.win_x64_run == 'true' }}
        uses: ./.github/actions/hash-skip
        env:
          HASH_SKIP_EXTRA_CLOSURE: ${{ needs.plan.outputs.win_x64_closure }}
          HASH_SKIP_EXTRA_SHELL: ${{ needs.plan.outputs.win_x64_shell }}
        with:
          hash_skip: release.public_acceptance.win
          mode: complete
      - name: Project reusable public acceptance credentials
        if: ${{ needs.plan.outputs.reuse_json != '{}' }}
        env:
          RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_METADATA_URL: ${{ inputs.metadata_url }}
          RELEASE_PUBLIC_ACCEPTANCE_CREDENTIAL_DIR: ${{ runner.temp }}/public-acceptance
          RELEASE_PUBLIC_ACCEPTANCE_REUSE_JSON: ${{ needs.plan.outputs.reuse_json }}
          RELEASE_PUBLIC_ACCEPTANCE_WORK_DIR: ${{ runner.temp }}/public-acceptance-projection
          RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
          RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
          RELEASE_STORAGE_REGION: auto
          RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
        run: pnpm exec tools-release project-public-acceptance
      - name: Issue stable qualification for accepted prerelease
        if: ${{ inputs.exact_name == 'prerelease' }}
        env:
          RELEASE_MAC_ARM64_SMOKE_RESULT: success
          RELEASE_MAC_X64_SMOKE_RESULT: success
          RELEASE_MANIFEST_DIR: ${{ runner.temp }}/release-platform-manifests
          RELEASE_METADATA_PATH: ${{ runner.temp }}/release-metadata/metadata.json
          RELEASE_METADATA_URL: ${{ inputs.metadata_url }}
          RELEASE_OUTPUTS_PATH: ${{ runner.temp }}/release-qualification/outputs.json
          RELEASE_QUALIFICATION_WORK_DIR: ${{ runner.temp }}/release-qualification
          RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
          RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
          RELEASE_STORAGE_REGION: auto
          RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
          RELEASE_WIN_X64_SMOKE_RESULT: success
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE_MANIFEST_DIR" "$(dirname "$RELEASE_METADATA_PATH")"
          curl -fsSL "$RELEASE_METADATA_URL" -o "$RELEASE_METADATA_PATH"
          for target in mac_arm64 mac_x64 win_x64; do
            jq --arg target "$target" '.releaseTargets[$target]' "$RELEASE_METADATA_PATH" > "$RELEASE_MANIFEST_DIR/$target.json"
          done
          pnpm exec tools-release issue-stable-qualification
      - name: Activate accepted immutable exact metadata with CAS
        env:
          RELEASE_ACTIVATION_WORK_DIR: ${{ runner.temp }}/release-activation
          RELEASE_OUTPUTS_PATH: ${{ runner.temp }}/release-activation/outputs.json
          RELEASE_PUBLIC_ACCEPTANCE_CREDENTIAL_DIR: ${{ runner.temp }}/public-acceptance
          RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
          RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
          RELEASE_STORAGE_REGION: auto
          RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
        run: pnpm exec tools-release activate-public-release
      - name: Read back activated exact public feed
        env:
          RELEASE_LATEST_METADATA_URL: ${{ inputs.public_origin }}/${{ inputs.exact_name }}/latest/metadata.json
          RELEASE_METADATA_URL: ${{ inputs.metadata_url }}
          RELEASE_PUBLIC_FEED_REPORT_PATH: ${{ runner.temp }}/release-activation/public-feed-observation.json
        run: pnpm exec tools-release observe-public-feed
      - name: Publish activation summary
        run: |
          {
            echo "## Accepted exact activation"
            echo ""
            echo "- version: \`${{ inputs.release_version }}\`"
            echo "- commit: \`${{ inputs.commit }}\`"
            echo "- mac_arm64/mac_x64/win_x64 public artifact smoke: \`success\`"
            echo "- latest CAS and public readback: \`success\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Cleanup workflow artifacts
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release/github/cleanup-artifacts.sh
