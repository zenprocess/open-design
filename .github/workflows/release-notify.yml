name: release-notify

on:
  workflow_call:
    inputs:
      activation_completed_at:
        required: false
        type: string
        default: ""
      actor:
        required: false
        type: string
        default: ""
      branch:
        required: false
        type: string
        default: ""
      channel:
        required: true
        type: string
      commit:
        required: false
        type: string
        default: ""
      event_name:
        required: false
        type: string
        default: ""
      mac_arm64_smoke:
        required: false
        type: string
        default: ""
      mac_arm64_url:
        required: false
        type: string
        default: ""
      mac_x64_smoke:
        required: false
        type: string
        default: ""
      mac_x64_url:
        required: false
        type: string
        default: ""
      metadata_url:
        required: false
        type: string
        default: ""
      notification_stream:
        required: false
        type: string
        default: release
      previous_commit:
        required: false
        type: string
        default: ""
      release_mode:
        required: false
        type: string
        default: publish
      release_result:
        required: true
        type: string
      release_state:
        required: false
        type: string
        default: complete
      run_attempt:
        required: false
        type: string
        default: ""
      run_number:
        required: false
        type: string
        default: ""
      triggering_actor:
        required: false
        type: string
        default: ""
      version:
        required: false
        type: string
        default: ""
      win_x64_smoke:
        required: false
        type: string
        default: ""
      win_x64_url:
        required: false
        type: string
        default: ""
      workflow_name:
        required: false
        type: string
        default: ""
    secrets:
      # Compact 1:1 channel secret codec:
      # ["v1","https://open.feishu.cn/open-apis/bot/v2/hook/<id>","<sign-secret-or-empty>"]
      bot:
        required: false

permissions:
  actions: read
  contents: read

jobs:
  notify:
    name: Report release to Feishu
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release notifier
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.commit != '' && inputs.commit || github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: .github/scripts

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0

      - name: Post terminal release card
        id: post
        continue-on-error: true
        env:
          RELEASE_ACTIVATION_COMPLETED_AT: ${{ inputs.activation_completed_at }}
          RELEASE_ACTOR: ${{ inputs.actor }}
          RELEASE_BRANCH: ${{ inputs.branch }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_EVENT_NAME: ${{ inputs.event_name }}
          RELEASE_FEISHU_BOT: ${{ secrets.bot }}
          RELEASE_GITHUB_TOKEN: ${{ github.token }}
          RELEASE_MAC_ARM64_SMOKE: ${{ inputs.mac_arm64_smoke }}
          RELEASE_MAC_ARM64_URL: ${{ inputs.mac_arm64_url }}
          RELEASE_MAC_X64_SMOKE: ${{ inputs.mac_x64_smoke }}
          RELEASE_MAC_X64_URL: ${{ inputs.mac_x64_url }}
          RELEASE_METADATA_URL: ${{ inputs.metadata_url }}
          RELEASE_MODE: ${{ inputs.release_mode }}
          RELEASE_NOTIFICATION_STREAM: ${{ inputs.notification_stream }}
          RELEASE_PREVIOUS_COMMIT: ${{ inputs.previous_commit }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_RESULT: ${{ inputs.release_result }}
          RELEASE_RUN_ATTEMPT: ${{ inputs.run_attempt }}
          RELEASE_RUN_NUMBER: ${{ inputs.run_number }}
          RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_STATE: ${{ inputs.release_state }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_WIN_X64_SMOKE: ${{ inputs.win_x64_smoke }}
          RELEASE_WIN_X64_URL: ${{ inputs.win_x64_url }}
          RELEASE_TRIGGERING_ACTOR: ${{ inputs.triggering_actor }}
          RELEASE_WORKFLOW_NAME: ${{ inputs.workflow_name }}
        run: node --experimental-strip-types .github/scripts/release_notification.ts

      - name: Warn when Feishu delivery fails
        if: steps.post.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Feishu release notification failed after notifier retries; release outcome is unchanged."
          echo "Feishu: delivery failed (non-gating)" >> "$GITHUB_STEP_SUMMARY"
